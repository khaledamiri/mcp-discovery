<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MCP Discovery</title>
<style>
:root {
  --bg: #f2f4f6; --panel: #ffffff; --ink: #18232d; --muted: #5b6875; --line: #d9dee3;
  --accent: #1f6f8b; --up: #2e8540; --warn: #b26b00; --down: #c23b22; --idle: #6b6f76;
  --up-bg: #e5f2e8; --warn-bg: #fbf0dc; --down-bg: #fae6e1; --idle-bg: #ebecee;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161c; --panel: #172029; --ink: #e3e8ed; --muted: #93a0ac; --line: #2a3540;
    --accent: #4fb3d1; --up: #4cc26b; --warn: #e0a030; --down: #f06a50; --idle: #9aa1a9;
    --up-bg: #183424; --warn-bg: #3a2c12; --down-bg: #3d1d17; --idle-bg: #232c35;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 32px 0 12px; font-weight: 650; }
code, .mono { font-family: var(--mono); font-size: 13px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; }
button:hover { border-color: var(--accent); }
button.danger:hover { border-color: var(--down); color: var(--down); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=password], input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 10px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.subtitle { color: var(--muted); font-size: 14px; }
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
#keyForm { display: none; gap: 6px; }
#keyForm.open { display: flex; }

.health { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.stat .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .label { color: var(--muted); font-size: 13px; }
.pulse { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 16px; min-height: 18px; }
.pulse span { width: 8px; height: 18px; border-radius: 2px; background: var(--up); }
.pulse span.warn { background: var(--warn); } .pulse span.down { background: var(--down); } .pulse span.idle { background: var(--idle); }
.pulse-caption { color: var(--muted); font-size: 13px; margin-top: 6px; }

.banner { margin-top: 16px; padding: 12px 16px; border-radius: 8px; border: 1px solid; }
.banner.down { background: var(--down-bg); border-color: var(--down); }
.banner.warn { background: var(--warn-bg); border-color: var(--warn); }
.banner strong { display: block; }

.search { display: flex; gap: 8px; }
.search input { flex: 1; max-width: 520px; }
.results { margin-top: 10px; display: grid; gap: 8px; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.result .desc { color: var(--muted); font-size: 14px; }
.hint { color: var(--muted); font-size: 14px; }

.server { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.server-head { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 0; border-radius: 0; padding: 14px 18px; text-align: left; background: transparent; }
.server-head:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.server-name { font-weight: 650; font-size: 16px; }
.server-name::before { content: "\25B8"; display: inline-block; width: 18px; color: var(--muted); transition: transform .15s; }
.server.open .server-name::before { transform: rotate(90deg); }
.server-meta { display: flex; gap: 14px; color: var(--muted); font-size: 14px; flex-wrap: wrap; justify-content: flex-end; }
.instances { display: none; border-top: 1px solid var(--line); }
.server.open .instances { display: block; }

.instance { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 20px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.instance:last-child { border-bottom: 0; }
.instance .id { font-weight: 600; word-break: break-all; }
.instance .endpoint { color: var(--muted); word-break: break-all; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-right: 8px; vertical-align: 1px; }
.badge.UP { background: var(--up-bg); color: var(--up); }
.badge.DOWN { background: var(--down-bg); color: var(--down); }
.badge.STARTING { background: var(--warn-bg); color: var(--warn); }
.badge.OUT_OF_SERVICE { background: var(--idle-bg); color: var(--idle); }
.lease { font-size: 13px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--idle-bg); margin: 6px 0 4px; overflow: hidden; max-width: 220px; }
.meter div { height: 100%; background: var(--up); transition: width .4s ease; }
.meter.warn div { background: var(--warn); } .meter.down div { background: var(--down); }
.tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.tool { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--idle-bg); }
.probe-error { grid-column: 1 / -1; color: var(--warn); font-size: 13px; }
.actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }

.connect { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 20px 18px; }
.urls { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 0 16px; align-items: center; margin: 0; }
.urls dt { color: var(--muted); font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.urls dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
.urls dd.copy { text-align: right; }
.urls a { color: var(--accent); }
.urls .note { display: block; color: var(--muted); font-family: system-ui, sans-serif; font-size: 13px; }
.snippet { margin-top: 16px; }
.snippet-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.snippet pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin: 8px 0 0; }
@media (max-width: 720px) { .urls { grid-template-columns: 1fr auto; } .urls dt { grid-column: 1 / -1; border: 0; padding-bottom: 0; } }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; }
.empty pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }

@media (max-width: 720px) {
  .instance { grid-template-columns: 1fr; }
  .actions { justify-content: flex-start; }
  .server-head { grid-template-columns: 1fr; }
  .server-meta { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1>MCP Discovery</h1>
      <div class="subtitle">Registry of MCP servers and their tools</div>
    </div>
    <div class="controls">
      <span id="updated" aria-live="polite"></span>
      <label><input type="checkbox" id="auto" checked> Auto-refresh</label>
      <button type="button" id="keyToggle">API key</button>
      <form id="keyForm">
        <input type="password" id="keyInput" placeholder="X-Mcp-Discovery-Key" autocomplete="off" aria-label="API key">
        <button type="submit">Save</button>
      </form>
    </div>
  </div>

  <section class="health" aria-label="Registry health">
    <div class="stats">
      <div class="stat"><div class="value" id="sInstances">–</div><div class="label">Registered instances</div></div>
      <div class="stat"><div class="value" id="sUp">–</div><div class="label">Available (UP)</div></div>
      <div class="stat"><div class="value" id="sRenewals">–</div><div class="label" id="sRenewalsLabel">Heartbeats last minute</div></div>
      <div class="stat"><div class="value" id="sSelf">–</div><div class="label">Self-preservation</div></div>
    </div>
    <div class="pulse" id="pulse" aria-hidden="true"></div>
    <div class="pulse-caption" id="pulseCaption"></div>
  </section>
  <div id="alerts"></div>

  <h2>Connect to this registry</h2>
  <section class="connect" aria-label="Registry addresses">
    <dl class="urls" id="urls"></dl>
    <div class="snippet">
      <div class="snippet-head"><span>application.yml of an MCP server or agent</span><button type="button" id="copyYml">Copy</button></div>
      <pre id="yml"></pre>
    </div>
  </section>

  <h2>Find a tool</h2>
  <form class="search" id="searchForm" role="search">
    <input type="search" id="query" placeholder="Describe what you need, e.g. search jira issues" aria-label="Tool search">
    <button type="submit">Search</button>
  </form>
  <div class="results" id="results"></div>

  <h2 id="serversTitle">Servers</h2>
  <div id="servers"></div>
</main>

<script>
(() => {
  const API = '__API_BASE__';
  const KEY_STORAGE = 'mcp-discovery-key';
  const REFRESH_MS = 5000;
  const state = { key: loadKey(), open: new Set(), firstRender: true, timer: null };

  const $ = id => document.getElementById(id);

  function loadKey() {
    try { return sessionStorage.getItem(KEY_STORAGE) || ''; } catch (e) { return ''; }
  }
  function saveKey(value) {
    state.key = value;
    try { value ? sessionStorage.setItem(KEY_STORAGE, value) : sessionStorage.removeItem(KEY_STORAGE); } catch (e) { /* storage unavailable */ }
  }

  /** Builds DOM nodes; strings always go through textContent, never innerHTML. */
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  async function api(path, options = {}) {
    const headers = { 'Accept': 'application/json', ...(options.headers || {}) };
    if (state.key) headers['X-Mcp-Discovery-Key'] = state.key;
    const res = await fetch(API + path, { ...options, headers });
    if (!res.ok) {
      const err = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  function ageText(seconds) {
    if (seconds < 1) return 'just now';
    if (seconds < 60) return Math.round(seconds) + ' s ago';
    if (seconds < 3600) return Math.round(seconds / 60) + ' min ago';
    return Math.round(seconds / 3600) + ' h ago';
  }

  /** Lease freshness: "up" within 1.5 heartbeat intervals, "warn" until the lease ends, "down" after. */
  function freshness(instance, status) {
    const age = Math.max(0, (Date.parse(status.serverTime) - Date.parse(instance.lastRenewal)) / 1000);
    const lease = status.leaseDurationSeconds || 90;
    const interval = status.renewalIntervalSeconds || 30;
    const level = age <= interval * 1.5 ? 'up' : age < lease ? 'warn' : 'down';
    return { age, level, remaining: Math.max(0, 1 - age / lease) };
  }

  // ------------------------------------------------------------------ rendering

  function renderHealth(status, instances) {
    $('sInstances').textContent = status.instances;
    $('sUp').textContent = status.upInstances;
    $('sRenewals').textContent = status.renewalsLastMinute;
    $('sRenewalsLabel').textContent = 'Heartbeats last minute (minimum ' + status.renewalThreshold + ')';
    $('sSelf').textContent = status.selfPreservationActive ? 'Active' : 'Off';
    $('sSelf').style.color = status.selfPreservationActive ? 'var(--down)' : '';

    const pulse = $('pulse');
    pulse.replaceChildren(...instances.map(i => {
      const f = freshness(i, status);
      const cls = i.status === 'UP' ? f.level : i.status === 'DOWN' ? 'down' : 'idle';
      return h('span', { class: cls === 'up' ? '' : cls, title: i.serverName + ' / ' + i.instanceId });
    }));
    const late = instances.filter(i => freshness(i, status).level !== 'up').length;
    $('pulseCaption').textContent = instances.length === 0 ? ''
      : 'One bar per instance. ' + (late === 0 ? 'Every instance sent a heartbeat on time.'
        : plural(late, 'instance') + ' missed recent heartbeats.');
  }

  function renderAlerts(status, error) {
    const alerts = [];
    if (error) {
      const why = error.status === 401
        ? 'The registry requires an API key for reads. Enter it with the API key button.'
        : 'Check that the registry is running and reachable from this browser.';
      alerts.push(h('div', { class: 'banner down', role: 'alert' },
        h('strong', null, 'Cannot load registry data (' + (error.status ? 'HTTP ' + error.status : error.message) + ')'), why));
    } else if (status && status.selfPreservationActive) {
      alerts.push(h('div', { class: 'banner warn', role: 'alert' },
        h('strong', null, 'Self-preservation is active: eviction is suspended'),
        'Fewer heartbeats arrived than expected (' + status.renewalsLastMinute + ' in the last minute, minimum '
          + status.renewalThreshold + '). This usually means a network problem between the servers and the registry. '
          + 'Instances that really stopped stay listed until heartbeats recover.'));
    }
    $('alerts').replaceChildren(...alerts);
  }

  function renderServers(servers, instances, status) {
    const byServer = new Map();
    for (const i of instances) {
      if (!byServer.has(i.serverName)) byServer.set(i.serverName, []);
      byServer.get(i.serverName).push(i);
    }
    if (state.firstRender && servers.length <= 5) servers.forEach(s => state.open.add(s.serverName));
    state.firstRender = false;

    $('serversTitle').textContent = servers.length ? 'Servers (' + servers.length + ')' : 'Servers';
    if (servers.length === 0) {
      $('servers').replaceChildren(h('div', { class: 'empty' },
        h('strong', null, 'No MCP server is registered yet.'),
        h('p', { class: 'hint' }, 'Add the mcp-discovery-client-spring-boot-starter dependency to an MCP server, or register one by hand:'),
        h('pre', null, "curl -X POST " + location.origin + API + "/servers \\\n  -H 'Content-Type: application/json' -H 'X-Mcp-Discovery-Key: <key>' \\\n  -d '{\"serverName\":\"jira-mcp\",\"endpoint\":\"http://localhost:8080/mcp\"}'")));
      return;
    }

    $('servers').replaceChildren(...servers.map(s => {
      const open = state.open.has(s.serverName);
      const list = byServer.get(s.serverName) || [];
      return h('div', { class: 'server' + (open ? ' open' : '') },
        h('button', {
          type: 'button', class: 'server-head', 'aria-expanded': open,
          onclick: e => {
            const card = e.currentTarget.parentElement;
            const nowOpen = card.classList.toggle('open');
            e.currentTarget.setAttribute('aria-expanded', String(nowOpen));
            nowOpen ? state.open.add(s.serverName) : state.open.delete(s.serverName);
          }
        },
          h('span', { class: 'server-name' }, s.serverName),
          h('span', { class: 'server-meta' },
            h('span', null, s.upInstances + ' of ' + plural(s.instances, 'instance') + ' up'),
            h('span', null, plural(s.toolCount, 'tool')),
            s.versions.length ? h('span', null, 'v' + s.versions.join(', v')) : null)),
        h('div', { class: 'instances' }, list.map(i => renderInstance(i, status))));
    }));
  }

  function renderInstance(i, status) {
    const f = freshness(i, status);
    const lease = status.leaseDurationSeconds || 90;
    const leaseText = f.level === 'down'
      ? 'Last heartbeat ' + ageText(f.age) + ' · lease expired, awaiting eviction'
      : 'Last heartbeat ' + ageText(f.age) + ' · lease ends in ' + Math.max(0, Math.round(lease - f.age)) + ' s';
    return h('div', { class: 'instance' },
      h('div', null,
        h('div', null, h('span', { class: 'badge ' + i.status }, i.status.replace(/_/g, ' ')), h('span', { class: 'id mono' }, i.instanceId)),
        h('div', { class: 'endpoint mono' }, i.endpoint)),
      h('div', null,
        h('div', { class: 'lease' }, i.version ? 'Version ' + i.version : 'No version'),
        h('div', { class: 'meter ' + (f.level === 'up' ? '' : f.level), role: 'img', 'aria-label': 'Lease ' + Math.round(f.remaining * 100) + ' percent remaining' },
          h('div', { style: 'width:' + Math.round(f.remaining * 100) + '%' })),
        h('div', { class: 'lease' }, leaseText)),
      renderActions(i),
      i.tools && i.tools.length
        ? h('div', { class: 'tools' }, i.tools.map(t => h('span', { class: 'tool', title: t.description || '' }, t.name)))
        : h('div', { class: 'tools hint' }, 'No tools known yet.'),
      i.lastProbeError ? h('div', { class: 'probe-error' }, 'Last tool probe failed: ' + i.lastProbeError) : null);
  }

  function renderActions(i) {
    if (!state.key) {
      return h('div', { class: 'actions' }, h('button', {
        type: 'button', title: 'Taking an instance out of service or deregistering it requires the registry API key',
        onclick: openKeyForm
      }, 'Manage (API key required)'));
    }
    const path = '/servers/' + encodeURIComponent(i.serverName) + '/instances/' + encodeURIComponent(i.instanceId);
    const setStatus = value => () => act(() => api(path + '/status', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: value })
    }));
    return h('div', { class: 'actions' },
      i.status === 'UP'
        ? h('button', { type: 'button', onclick: setStatus('OUT_OF_SERVICE') }, 'Take out of service')
        : h('button', { type: 'button', onclick: setStatus('UP') }, 'Put back in service'),
      h('button', {
        type: 'button', class: 'danger',
        onclick: () => {
          if (confirm('Deregister ' + i.serverName + ' / ' + i.instanceId + '? A running instance registers again at its next heartbeat.')) {
            act(() => api(path, { method: 'DELETE' }));
          }
        }
      }, 'Deregister'));
  }

  async function act(call) {
    try {
      await call();
    } catch (e) {
      alert(e.status === 401 ? 'The API key was rejected.' : 'The action failed (' + e.message + ').');
    }
    refresh();
  }

  // ------------------------------------------------------------------ connection details

  const ROOT = location.origin + API.replace(/\/api\/v1$/, '');

  function copy(text, button) {
    const done = () => { const label = button.textContent; button.textContent = 'Copied'; setTimeout(() => { button.textContent = label; }, 1500); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done) {
    const area = h('textarea', { style: 'position:absolute;left:-9999px' });
    area.value = text;
    document.body.append(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* copy unsupported */ }
    area.remove();
  }

  function urlRow(label, url, note, link) {
    const button = h('button', { type: 'button' }, 'Copy');
    button.addEventListener('click', () => copy(url, button));
    return [
      h('dt', null, label),
      h('dd', { class: 'mono' }, link ? h('a', { href: url }, url) : url, note ? h('span', { class: 'note' }, note) : null),
      h('dd', { class: 'copy' }, button)];
  }

  async function renderConnect() {
    const rows = [
      urlRow('Registry URL', ROOT, 'Set it as mcp-discovery.client.registry-url in MCP servers and agents.'),
      urlRow('Dashboard', location.origin + location.pathname, 'This page.', true),
      urlRow('Register an instance', 'POST ' + ROOT + '/api/v1/servers', 'Requires the X-Mcp-Discovery-Key header when an API key is set.'),
      urlRow('Search tools', ROOT + '/api/v1/tools/search?q=jira', null, true),
      urlRow('List servers', ROOT + '/api/v1/servers', null, true),
      urlRow('Registry status', ROOT + '/api/v1/registry/status', null, true)];
    $('urls').replaceChildren(...rows.flat());
    try {
      const res = await fetch(ROOT + '/actuator/health', { headers: { 'Accept': 'application/json' } });
      if (res.ok) $('urls').append(...urlRow('Health check', ROOT + '/actuator/health', 'For load balancers and Kubernetes probes.', true));
    } catch (e) { /* actuator not installed */ }

    const yml = 'mcp-discovery:\n  client:\n    registry-url: ' + ROOT + '\n    api-key: ${MCP_DISCOVERY_API_KEY:}';
    $('yml').textContent = yml;
    $('copyYml').addEventListener('click', e => copy(yml, e.currentTarget));
  }

  // ------------------------------------------------------------------ data

  async function refresh() {
    try {
      const [status, servers, instances] = await Promise.all([
        api('/registry/status'), api('/servers'), api('/instances')]);
      renderHealth(status, instances);
      renderAlerts(status, null);
      renderServers(servers, instances, status);
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      renderAlerts(null, e);
      $('updated').textContent = '';
    }
  }

  async function search(query) {
    const results = $('results');
    if (!query.trim()) { results.replaceChildren(); return; }
    try {
      const matches = await api('/tools/search?limit=10&q=' + encodeURIComponent(query));
      results.replaceChildren(...(matches.length ? matches.map(m => h('div', { class: 'result' },
        h('div', null, h('strong', null, m.serverName), ' / ', h('code', null, m.toolName)),
        m.description ? h('div', { class: 'desc' }, m.description) : null,
        h('div', { class: 'hint' }, plural(m.endpoints.length, 'available instance') + ' · score ' + m.score)))
        : [h('div', { class: 'hint' }, 'No available tool matches "' + query + '". Try other words, or check that the server is UP.')]));
    } catch (e) {
      results.replaceChildren(h('div', { class: 'hint' }, 'Search failed (' + e.message + ').'));
    }
  }

  function schedule() {
    clearInterval(state.timer);
    if ($('auto').checked && !document.hidden) state.timer = setInterval(refresh, REFRESH_MS);
  }

  // ------------------------------------------------------------------ wiring

  $('auto').addEventListener('change', schedule);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); schedule(); });
  function openKeyForm() {
    $('keyForm').classList.add('open');
    $('keyInput').value = state.key;
    $('keyInput').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('keyToggle').addEventListener('click', () => {
    if ($('keyForm').classList.contains('open')) $('keyForm').classList.remove('open'); else openKeyForm();
  });
  $('keyForm').addEventListener('submit', e => {
    e.preventDefault();
    saveKey($('keyInput').value.trim());
    $('keyForm').classList.remove('open');
    $('keyToggle').textContent = state.key ? 'API key set' : 'API key';
    refresh();
  });
  let debounce;
  $('query').addEventListener('input', e => { clearTimeout(debounce); debounce = setTimeout(() => search(e.target.value), 250); });
  $('searchForm').addEventListener('submit', e => { e.preventDefault(); search($('query').value); });

  $('keyToggle').textContent = state.key ? 'API key set' : 'API key';
  renderConnect();
  refresh();
  schedule();
})();
</script>
</body>
</html>
